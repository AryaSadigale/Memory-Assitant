services:
  neo4j:
    image: neo4j:5.20.0
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_server_memory_heap_initial__size: "1G"
      NEO4J_server_memory_heap_max__size: "2G"
      NEO4J_server_memory_pagecache_size: "2G"
      NEO4J_db_transaction_timeout: "600s"

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: [ "CMD", "neo4j", "status" ]
      interval: 10s
      timeout: 10s
      retries: 10

  app:
    build: .
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password123
      GROQ_API_KEY: ${GROQ_API_KEY}
      SESSION_FILE: /app/session_data/.session_id
      HF_HOME: /app/model_cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: /app/model_cache/sentence_transformers
      TRANSFORMERS_VERBOSITY: error
    volumes:
      - ./data:/app/data
      - ./session_data:/app/session_data
      - ./model_cache:/app/model_cache
    stdin_open: true
    tty: true

volumes:
  neo4j_data:
  neo4j_logs:
